<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>壹龙的空间</title>
  </head>
  <body>
    <div id="root">
      <div id="loading-fallback" style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#666">
        加载中...
      </div>
    </div>
    <noscript>
      <div style="text-align:center;padding:60px;font-family:sans-serif">
        <h2>请启用 JavaScript 以使用此应用</h2>
      </div>
    </noscript>
    <script>
      // Global error handler for debugging
      window.onerror = function(msg, url, line, col, error) {
        var el = document.getElementById('root');
        if (el) {
          el.innerHTML = '<div style="padding:40px;font-family:monospace;color:#c00"><h2>应用错误</h2><pre>' +
            msg + '\n' + url + ':' + line + ':' + col +
            (error && error.stack ? '\n\n' + error.stack : '') + '</pre></div>';
        }
      };
      window.addEventListener('unhandledrejection', function(e) {
        var el = document.getElementById('root');
        if (el) {
          el.innerHTML = '<div style="padding:40px;font-family:monospace;color:#c00"><h2>Promise 错误</h2><pre>' +
            (e.reason ? (e.reason.message || e.reason) : '未知') +
            (e.reason && e.reason.stack ? '\n\n' + e.reason.stack : '') + '</pre></div>';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
